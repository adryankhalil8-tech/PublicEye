<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Original project-owned texture (synthetic fixture). Subtle paper grain. -->
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.31  0 0 0 0 0.25  0 0 0 0.10 0"/>
  </filter>
  <rect width="512" height="512" fill="#e8e1d2"/>
  <rect width="512" height="512" filter="url(#grain)"/>
</svg>
